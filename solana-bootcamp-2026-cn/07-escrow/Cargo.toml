# ============================================================
# 工作区配置（Workspace）—— 项目根目录的 Cargo.toml
# ============================================================
# Cargo 工作区允许一个项目包含多个 crate（子包），
# Anchor 项目通常把链上程序放在 programs/ 目录下。

[workspace]
members = [
    "programs/*"  # 将 programs/ 下的所有子目录作为工作区成员
]
# resolver = "2" 使用 Cargo 的新依赖解析器（Rust 2021 edition 默认开启）
# 新版本能更好地处理可选依赖（features），避免特性泄漏问题
resolver = "2"

# ============================================================
# 发布配置（Release Profile）—— 优化链上程序体积
# ============================================================
# Solana 对链上程序有严格的大小限制（BPF 加载器限制约 120KB），
# 所以需要尽可能压缩编译后的程序体积。

[profile.release]
# 开启溢出检查 —— 生产环境必须开启，防止整数溢出导致的安全问题
overflow-checks = true
# 使用最高级别的链接优化（fat LTO），跨模块内联和死代码消除，减小程序体积
lto = "fat"
# 单个代码生成单元，让编译器看到全局优化机会，进一步减小体积
codegen-units = 1

# 构建覆盖配置 —— 对构建脚本（build.rs）也做优化
[profile.release.build-override]
opt-level = 3       # 构建脚本用最高优化级别
incremental = false # 禁用增量编译，确保结果干净可复现
codegen-units = 1   # 同上，单单元最大化优化
