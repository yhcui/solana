# ============================================================
# Anchor 项目配置文件 —— Anchor.toml
# ============================================================
# 这是 Anchor 框架的核心配置文件，控制编译、测试、部署等行为。
# 每次运行 anchor build / anchor test / anchor deploy 都会读取此文件。

# ============================================================
# 工具链配置 —— 指定包管理器
# ============================================================
[toolchain]
package_manager = "yarn"  # 使用 yarn 管理前端/测试的依赖包（也可用 npm）

# ============================================================
# 功能开关
# ============================================================
[features]
# 自动解析依赖关系，开启后 Anchor 会处理 IDL 和程序间的依赖
resolution = true
# 是否跳过 lint 检查（关闭 = 编译时会检查代码规范）
skip-lint = false

# ============================================================
# 程序 ID 映射 —— 每个集群对应一个 Program ID
# ============================================================
# 这里的 key 是程序名称，value 是 Program ID（公钥）
# localnet 表示本地开发网络，部署到不同网络时需配置对应区块

[programs.localnet]
escrow = "25Q841qjRsaGQzWSKh5kiEZ9qpXbWMzm3v4ytGXs6PzY"

# ============================================================
# 注册表配置 —— Anchor 的公共注册表（较少使用）
# ============================================================
[registry]
url = "https://api.apr.dev"  # Anchor Program Registry 地址（类似 npm registry）

# ============================================================
# 提供者配置 —— 连接哪个网络、用哪个钱包
# ============================================================
[provider]
cluster = "localnet"  # 使用本地验证器（本地开发调试，不走主网）
wallet = "~/.config/solana/id.json"  # 本地钱包路径（用于签名交易和支付费用）

# ============================================================
# 脚本配置 —— 自定义命令的快捷方式
# ============================================================
[scripts]
# 运行测试的命令（执行 anchor test 时会跑这个）
# -p ./tsconfig.json  ：指定 TypeScript 配置
# -t 1000000          ：超时时间 100 万毫秒（约 16 分钟），链上测试比较慢
# "tests/**/*.ts"     ：匹配 tests 目录下所有 .ts 测试文件
test = "yarn run ts-mocha -p ./tsconfig.json -t 1000000 \"tests/**/*.ts\""
